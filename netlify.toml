[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Results pages (/resultats, /resultats/<pays>/<année>/<mois>) are app routes
# served by the single-page shell.
[[redirects]]
  from = "/resultats"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/resultats/*"
  to = "/index.html"
  status = 200

# Self-hosted fonts never change in place (a new version gets a new filename),
# so browsers may keep them forever and skip revalidation when offline-ish.
[[headers]]
  for = "/src/shared/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# The service worker, the HTML shell and the manifest must always be
# revalidated, otherwise an installed PWA can keep an older build in the
# HTTP cache even after the worker itself was updated.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
